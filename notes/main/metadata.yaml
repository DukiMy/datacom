# Annotated metadata for Pandoc's default standalone HTML5 output.
# Keep this file beside notes.md. Run from that directory:
# pandoc notes.md --standalone --embed-resources \
#   --metadata-file=metadata.yaml -o /var/www/dukimy/index.html
#
# Optional settings are commented out. Uncomment only what you need.
# Use top-level keys here: do not wrap everything inside "metadata:".
# Pandoc accepts custom keys, but they need a template/filter/writer to use them.

# PAGE IDENTITY
title: "Notes on Computer Networking"
pagetitle: "Notes on Computer Networking | dukimy.com"
# subtitle: "Notes on computer networking"
author:
  - "Durim Miziraj"
lang: en-GB
dir: ltr
description: "A collection of notes from what I've leared about computer networking."
keywords:
  - Computer networks

# title is a visible page heading; pagetitle is the browser-tab title.
# Omit title and keep pagetitle if you do not want Pandoc's title block.
# In the default HTML5 template, subtitle/author/date/abstract appear within
# that title block and therefore also require title.
# A prefix adds "dukimy.com - ..." to the browser title (using an en dash).
# title-prefix: "dukimy.com"

# abstract: |
#   A short overview of the page. Markdown **formatting** is supported.
# abstract-title: "Overview"

# Overrides for HTML head metadata, independent of the visible title block.
# Normally derived from author, date, and description.
# author-meta:
#   - "Durim"
# date-meta: "2026-09-30"
# description-meta: "A separate description for the HTML head."
# title-meta is useful for some other outputs; use pagetitle for HTML <title>.

# DEFAULT HTML STYLING
# These require the default styles.html partial or a compatible template.
# Keep document-css true to retain Pandoc's main built-in stylesheet.
document-css: true
# mainfont: "system-ui, sans-serif"
monofont: "ui-monospace, monospace"
# fontsize: "18px"
linestretch: 1.6
maxwidth: "60rem"
fontcolor: "#222222"
backgroundcolor: "#ffffff"
linkcolor: "#145da0"
monobackgroundcolor: "#ffffff"

# In the default HTML stylesheet these set body padding, despite their names.
# Its responsive rules may adjust padding on small screens.
margin-left: "2rem"
margin-right: "2rem"
margin-top: "2rem"
margin-bottom: "2rem"

# Naming a font does not install or download it for visitors.
# Quote hexadecimal colours: an unquoted # starts a YAML comment.

# NEWER HTML TEMPLATE SETTINGS
# These appear in the current Pandoc manual but are absent from the default
# Pandoc 3.1.3 styles.html used to validate this example. Check your template.
# quotecolor: "#555555"
# quotebordercolor: "#cccccc"
# fontcolordark: "#eeeeee"
# backgroundcolordark: "#181818"
# linkcolordark: "#9ecbff"
# quotecolordark: "#bbbbbb"
# quotebordercolordark: "#666666"
# monobackgroundcolordark: "#292929"

# CONTENTS HEADING
# This changes the heading only. Add --toc to the command to generate a TOC.
toc-title: "Table of Contents"

# EXTRA STYLESHEETS
# Files must exist and be reachable when Pandoc builds the page.
# With --embed-resources their content can be incorporated into the HTML.
# document-css: true above keeps the built-in styling as well.
# css:
#   - "style.css"
#   - "print.css"

# EXTRA HTML HEAD CONTENT
# Values below are actual content, not filenames.
# For a file instead, use --include-in-header=header.html on the command line.
header-includes:
  - |
    <link rel="icon" type="image/png" href="/var/www/dukimy/favicon.png">
