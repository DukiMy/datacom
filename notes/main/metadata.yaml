# CONTENT BEFORE / AFTER THE DOCUMENT
# These metadata values are parsed as Markdown.
# include-before:
#   - "[Home](https://dukimy.com/)"
# include-after:
#   - "*Notes by Durim.*"

# CITATIONS AND BIBLIOGRAPHIES
# Add --citeproc to the build command to process citations.
# Keep external bibliography/CSL files beside the project, or supply paths.
# bibliography:
#   - "references.bib"
# csl: "citation-style.csl"
# citation-style is an alias for csl; there is no need to set both.
# citation-abbreviations: "abbreviations.json"
# reference-section-title: "References"
# link-citations: true
# link-bibliography: true
# suppress-bibliography: false
# notes-after-punctuation: true

# Include every bibliography entry, even when not cited in the document:
# nocite: "@*"
# Or include selected otherwise-uncited entries:
# nocite: "@sample-notes, @another-reference"

# Inline CSL reference data can be used instead of, or with, bibliography.
# This is a fictional example. Cite it in Markdown as [@sample-notes].
# references:
#   - id: sample-notes
#     type: manuscript
#     title: "Example networking notes"
#     author:
#       - literal: "Example Author"
#     issued:
#       date-parts:
#         - [2026, 9, 30]

# CUSTOM METADATA
# These are valid keys, but have no automatic effect in the default HTML5
# template. A custom template or Lua filter must read and use them.
# site-name: "dukimy.com"
# footer-text: "My networking notebook"
# tags:
#   - networking
# draft: false
# A custom template can access a field with, for example, $site-name$.

# OTHER OUTPUT FORMATS
# These are examples for other writers/templates, not HTML styling options.
# Check the documentation for the format/engine you actually choose.
#
# Document properties in formats such as DOCX/PDF/EPUB (support varies):
# subject: "Computer networking"
# category: "Study notes"
# title-meta: "Transmission modes"
#
# LaTeX/PDF examples:
# documentclass: article
# classoption:
#   - oneside
# papersize: a4
# geometry:
#   - margin=25mm
# colorlinks: true
#
# EPUB examples:
# publisher: "Example Publisher"
# rights: "Copyright 2026 Example Author"
#
# Reveal.js / Beamer slides use additional fields such as theme and institute.
# Do not expect theme to select a theme for an ordinary HTML5 web page.

# BUILD OPTIONS BELONG IN THE COMMAND OR A SEPARATE DEFAULTS FILE
# Examples: standalone, embed-resources, toc, toc-depth, number-sections,
# citeproc, output-file, resource-path, template, filters, and pdf-engine.
# Putting those names in this metadata file does not activate their options.
# In particular, toc: true here is not a substitute for the --toc option.
# To use a defaults YAML file, load it with --defaults=defaults.yaml instead.

# YAML / PRECEDENCE NOTES
# Use real booleans (true / false), not the strings "true" / "false".
# Quote dates to keep them as strings. Lists use an indented dash per item.
# Use | followed by indented lines for multiline text.
# Do not define the same key twice: edit its existing value instead.
# Document metadata and --metadata/-M values override --metadata-file values.
# Later --metadata-file arguments override earlier metadata files.

# INSPECT YOUR INSTALLED VERSION
# pandoc --version
# pandoc --print-default-template=html5
# pandoc --print-default-data-file=templates/styles.html
# The two template commands show variables in the main template and its CSS
# partial. Citation processing and filters can consume additional fields.
#
# Official references:
# https://pandoc.org/MANUAL.html#variables
# https://pandoc.org/MANUAL.html#citations
# https://github.com/jgm/pandoc-templates/blob/master/default.html5
